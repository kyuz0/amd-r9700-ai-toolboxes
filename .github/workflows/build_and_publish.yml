name: Build & Publish AMD R9700 Toolboxes

on:
  push:
    branches:
      - main
    paths:
      - toolboxes/r9v-qwen38-rocm-10.0/**
      - .github/workflows/build_and_publish.yml
  workflow_dispatch:
    inputs:
      backends:
        description: >
          Comma-separated backends to build (rocm-10.0, therock-nightly, vulkan-radv, vulkan-rocmfpx, r9v-qwen38-rocm-10.0).
          Use "all" to build the standard llama.cpp set; model-specific and ROCmFPX images are built explicitly.
        required: false
        default: all

env:
  DOCKERHUB_REPO: docker.io/kyuz0/amd-r9700-toolboxes
  LOCAL_PREFIX: llama

jobs:
  # 1) Prepare a clean JSON array for the matrix
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix_json: ${{ steps.mk.outputs.matrix_json }}
    steps:
      - id: mk
        shell: bash
        run: |
          # Input from the Run workflow form
          IN='${{ inputs.backends }}'

          if [[ "${{ github.event_name }}" == "push" ]]; then
            JSON='["r9v-qwen38-rocm-10.0"]'
          elif [[ "$IN" == "all" || -z "$IN" ]]; then
            JSON='["rocm-10.0","therock-nightly","vulkan-radv"]'
          else
            # Remove spaces and build JSON array from comma list
            IN_CLEAN=$(echo "$IN" | tr -d '[:space:]')
            JSON='["'${IN_CLEAN//,/\",\"}'"]'
          fi

          echo "matrix_json=${JSON}" >> "$GITHUB_OUTPUT"
          echo "Using matrix: ${JSON}"

  # 2) Build each backend in parallel using the prepared matrix
  build-and-push:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJson(needs.prepare.outputs.matrix_json) }}

    steps:
      - name: Free up runner disk space
        run: |
          echo "Before cleanup:" && df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          docker builder prune --all --force
          echo "After cleanup:" && df -h /

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set build timestamp
        run: echo "BUILD_TS=$(date +%Y%m%dT%H%M%S)" >> $GITHUB_ENV

      - name: Build & push ${{ matrix.backend }}
        working-directory: toolboxes
        shell: bash
        run: |
          set -euo pipefail
          B="${{ matrix.backend }}"
          DF="Dockerfile.$B"
          CONTEXT="."
          if [[ -f "$B/Dockerfile" ]]; then
            DF="$B/Dockerfile"
            CONTEXT="$B"
          fi
          NAME="${B}"
          LI="${LOCAL_PREFIX}-${NAME}"
          TAG="${NAME}_${BUILD_TS}"
          IMM="${DOCKERHUB_REPO}:${TAG}"
          CHN="${DOCKERHUB_REPO}:${NAME}"
          BUILD_ARGS=()
          if [[ "$B" == "r9v-qwen38-rocm-10.0" ]]; then
            BUILD_ARGS+=(--build-arg MAX_JOBS=4)
          fi

          echo "→ Building ${DF}"
          docker build --no-cache "${BUILD_ARGS[@]}" -t "${LI}" -f "${DF}" "${CONTEXT}"

          echo "→ Running smoke test..."
          if [[ "$B" == "r9v-qwen38-rocm-10.0" ]]; then
            docker run --rm "${LI}" bash -lc "dpkg-query -W -f='\${Version}\\n' amdrocm-base10.0 | grep -Eq '^10\\.0\\.0-'"
            docker run --rm "${LI}" python -c 'import importlib.metadata as m, torch; assert torch.version.hip.startswith("7.15"); print("torch", torch.__version__, "hip", torch.version.hip, "vllm", m.version("vllm"), "plugin", m.version("vllm-gguf-plugin"))'
            docker run --rm "${LI}" vllm --help
          else
            docker run --rm "${LI}" bash -c "if command -v llama >/dev/null; then llama version; else llama-cli --version; fi"
            docker run --rm "${LI}" llama-cli --help || { status=$?; echo "llama-cli exited with status $status"; [[ $status -eq 0 || $status -eq 1 || $status -eq 134 ]]; }
            docker run --rm "${LI}" llama-server --help || { status=$?; echo "llama-server exited with status $status"; [[ $status -eq 0 || $status -eq 1 || $status -eq 134 ]]; }
          fi

          echo "→ Tag & push immutable → ${IMM}"
          docker tag "${LI}" "${IMM}"
          docker push "${IMM}"

          echo "→ Tag & push channel → ${CHN}"
          docker tag "${IMM}" "${CHN}"
          docker push "${CHN}"
